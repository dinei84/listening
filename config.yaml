extractor: pymupdf
speaker: kokoro
queue: sqlite
# Teto de segurança por livro (OS-042): se a estimativa de custo de um livro
# ultrapassar este valor, ele NÃO usa o Speaker pago mesmo com confirmação —
# degrada para a voz local (fallback_speaker) com aviso ao usuário.
# null = sem teto (qualquer estimativa segue o fluxo normal de confirmação).
max_cost_per_book: null

# Retry de falha transitória na síntese (OS-043): nº total de tentativas e backoff
# exponencial (o delay dobra a cada tentativa, até max_delay_seconds). Falha
# permanente (credencial inválida, texto rejeitado) nunca é retentada.
retry:
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0

# Normalizador de texto (OS-038) — nível médio do produto.
# "noop" (padrão) não toca a rede e não custa nada.
# Para ligar o nível médio: name: llm, e a chave numa variável de ambiente.
normalizer:
  name: llm
  base_url: https://api.deepseek.com/v1   # qualquer endpoint compatível com OpenAI
  model: deepseek-chat
  api_key_env: LLM_API_KEY                # a chave NUNCA fica neste arquivo
  cost_per_char: 0.0000012                # para a trava de custo da OS-042
  # divergence_ratio: 0.5                 # janela do guarda-corpo (padrão: +100%/-15%)
