<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + as safe-area do CSS: sem isso a barra fixa de
         controles some atras do gesto de home do iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Audiobook Player</title>
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Audiobook" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Audiobook Player</h1>

    <section id="upload-section">
      <h2>Enviar PDF</h2>
      <form id="upload-form">
        <input type="file" id="pdf-input" accept="application/pdf" required />
        <label>
          Idioma:
          <select id="language-select">
            <option value="">Automático</option>
            <option value="en">Inglês</option>
            <option value="es">Espanhol</option>
            <option value="fr">Francês</option>
            <option value="hi">Hindi</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="ja">Japonês</option>
            <option value="zh-cn">Chinês (simplificado)</option>
            <option value="zh-tw">Chinês (tradicional)</option>
          </select>
        </label>
        <label>
          Voz:
          <select id="voice-select" disabled>
            <option value="">Padrão do idioma</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="normalize-checkbox" />
          Melhorar texto com IA (números e abreviações por extenso)
        </label>
        <button type="submit">Enviar</button>
      </form>
      <p id="upload-status"></p>
    </section>

    <section id="books-list-section">
      <h2>Meus livros</h2>
      <p id="worker-warning" hidden></p>
      <button id="refresh-books-btn" type="button">Atualizar lista</button>
      <ul id="books-list"></ul>
      <p id="books-list-empty" hidden>Nenhum livro ainda.</p>
    </section>

    <section id="manual-section">
      <h2>Abrir livro existente</h2>
      <form id="manual-form">
        <input type="text" id="book-id-input" placeholder="id do livro" />
        <button type="submit">Abrir</button>
      </form>
    </section>

    <section id="player-section" hidden>
      <h2 id="player-title">Player</h2>
      <progress id="synthesis-progress" value="0" max="1" hidden></progress>
      <p id="player-status"></p>
      <p id="cost-warning" hidden></p>
      <p id="confirm-cost-banner" hidden>
        <button id="confirm-cost-btn" type="button">Confirmar custo estimado</button>
      </p>
      <p id="position-indicator" hidden></p>

      <p id="resume-banner" hidden>
        Retomar de onde parou?
        <button id="resume-btn" type="button">Retomar</button>
        <button id="restart-btn" type="button">Começar do início</button>
      </p>

      <!-- Sem `controls` (OS-057): a regua nativa cobre a src corrente, ou seja um
           trecho de ~53 s num livro de ~7,8 h. Quem manda agora e a barra abaixo,
           que e a do LIVRO. Duas barras na tela seriam duas verdades. -->
      <audio id="audio-player"></audio>

      <div id="timeline">
        <input
          type="range"
          id="scrub"
          min="0"
          max="0"
          step="0.1"
          value="0"
          aria-label="Posição no livro"
        />
        <p id="time-readout"></p>
      </div>

      <div id="chapters-section" hidden>
        <h3>Capítulos</h3>
        <ul id="chapters-list"></ul>
      </div>

      <div id="controls">
        <button id="prev-btn" type="button">◀ Anterior</button>
        <button id="back-15-btn" type="button">↺ 15s</button>
        <button id="play-pause-btn" type="button">Play/Pause</button>
        <button id="forward-15-btn" type="button">15s ↻</button>
        <button id="next-btn" type="button">Próximo ▶</button>
        <label>
          Velocidade:
          <select id="speed-select">
            <option value="0.8">0.8x — técnico (~117 WPM)</option>
            <option value="0.9">0.9x (~131 WPM)</option>
            <option value="1" selected>1x — padrão (~146 WPM)</option>
            <option value="1.25">1.25x (~182 WPM)</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
        </label>
      </div>
    </section>

    <!-- timeline.js primeiro: o app.js usa o Timeline ja no carregamento. -->
    <script src="timeline.js"></script>
    <script src="nowplaying.js"></script>
    <script src="app.js"></script>
  </body>
</html>
