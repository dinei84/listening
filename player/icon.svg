<!-- Ícone provisório do manifest (OS-058): formas geométricas, não arte. Existe
     porque um manifest apontando para 404 quebra a instalação. Trocar por arte
     de verdade é decisão do dono, não de agente de execução. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Audiobook">
  <rect width="512" height="512" rx="96" fill="#1a1a1a" />
  <!-- livro aberto -->
  <path d="M136 168h100c13 0 24 11 24 24v160c0-13-11-24-24-24H136z" fill="#fff" opacity=".9" />
  <path d="M376 168H276c-13 0-24 11-24 24v160c0-13 11-24 24-24h100z" fill="#fff" opacity=".6" />
  <!-- arco de fone sobre o livro -->
  <path d="M168 168a88 88 0 0 1 176 0" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round" />
  <rect x="148" y="160" width="36" height="56" rx="18" fill="#fff" />
  <rect x="328" y="160" width="36" height="56" rx="18" fill="#fff" />
</svg>
