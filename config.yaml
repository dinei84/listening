extractor: pymupdf
# Motor de voz. "kokoro" roda local e não custa nada; "openai" usa a API paga
# (OS-055) e exige OPENAI_API_KEY no .env — a estimativa de custo da OS-042 passa
# a valer, então o livro para em "Aguardando confirmação de custo" antes de gastar.
speaker: kokoro
queue: sqlite
# Teto de segurança por livro (OS-042): se a estimativa de custo de um livro
# ultrapassar este valor, ele NÃO usa o Speaker pago mesmo com confirmação —
# degrada para a voz local (fallback_speaker) com aviso ao usuário.
# null = sem teto (qualquer estimativa segue o fluxo normal de confirmação).
max_cost_per_book: null

# Retry de falha transitória na síntese (OS-043): nº total de tentativas e backoff
# exponencial (o delay dobra a cada tentativa, até max_delay_seconds). Falha
# permanente (credencial inválida, texto rejeitado) nunca é retentada.
retry:
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0

# Normalizador de texto (OS-038) — nível médio do produto.
# "noop" (padrão) não toca a rede e não custa nada.
# Para ligar o nível médio: name: llm, e a chave numa variável de ambiente.
normalizer:
  name: llm
  base_url: https://api.deepseek.com/v1   # qualquer endpoint compatível com OpenAI
  model: deepseek-chat
  api_key_env: LLM_API_KEY                # a chave NUNCA fica neste arquivo
  cost_per_char: 0.0000012                # para a trava de custo da OS-042
  # divergence_ratio: 0.5                 # janela do guarda-corpo (padrão: +100%/-15%)

# Preparação prosódica (OS-054) — segundo passe de LLM, separado da notação acima.
# Só ajusta a PONTUAÇÃO (vírgula/pausa, divisão de frase longa), com guarda-corpo
# próprio que exige a sequência de palavras idêntica. Desligado por padrão: "prosody"
# só entra na cadeia se o dono ligar e fornecer a chave. Ligar dobra a estimativa de
# custo do nível médio (notação + prosódia) para melhorar ~13% das frases.
prosody:
  name: noop
  # base_url: https://api.deepseek.com/v1  # qualquer endpoint compatível com OpenAI
  # model: deepseek-chat
  # api_key_env: PROSODY_API_KEY           # a chave NUNCA fica neste arquivo
  # cost_per_char: 0.0000012               # somado à estimativa da OS-042
  # divergence_ratio: 0.5


# Roteamento por expressividade (OS-056). Conta as frases com "!" ou "?" em cada
# chunk e, a partir de min_expressive_sentences, manda o chunk INTEIRO para o
# motor pago — o resto do livro continua no motor local, de graça.
#
# Medido em 230 chunks reais do "Programador Pragmático":
#   limiar 1 -> 37,1% do livro no pago, US$3,19,  86 trocas de voz
#   limiar 3 -> 9,2%  do livro no pago, US$0,79,  32 trocas   <- padrão
#   por frase-> 9,0%  do livro no pago, US$0,78, 374 trocas
#
# Trocar de motor no meio da frase é o que produz a emenda audível; por isso a
# decisão é por chunk, e a troca cai numa fronteira que já tem pausa.
# Exige OPENAI_API_KEY no .env e `enabled: true`.
routing:
  enabled: true
  premium_speaker: openai
  min_expressive_sentences: 3
